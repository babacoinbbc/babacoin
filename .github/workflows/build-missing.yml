name: Native Windows and macOS compatibility (no release upload)
'on':
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to validate
        type: choice
        options:
        - all
        - macos
        - windows
        default: all
  workflow_call:
    inputs:
      platform:
        type: string
        default: all
permissions:
  contents: read
jobs:
  macos:
    name: macOS ${{ matrix.arch }} native tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-15
          arch: arm64
        - runner: macos-15-intel
          arch: x86_64
    steps:
    - uses: actions/checkout@v4
    - name: Build with BDB 4.8; run full native tests
      run: bash ci/macos-compat.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: babacoin-tested-macos-${{ matrix.arch }}
        path: desktop-output
        if-no-files-found: error
    if: ${{ inputs.platform != 'windows' }}
  windows-cross:
    name: Windows x64
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v4
    - name: Install MinGW + tools
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-mingw-w64-x86-64 mingw-w64 autoconf automake libtool pkg-config python3 nsis curl xz-utils bsdmainutils cmake libgmp-dev
    - name: Set POSIX threading
      run: |
        sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
        sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
    - name: Cache depends
      uses: actions/cache@v4
      with:
        path: depends/built
        key: windows-depends-${{ hashFiles('depends/packages/*.mk') }}-v3
    - name: Pre-fetch GMP + Qt sources
      run: |
        mkdir -p depends/sources
        curl -L --retry 3 -o depends/sources/gmp-6.3.0.tar.bz2 https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.bz2
        curl -L --retry 3 -o depends/sources/qtbase-opensource-src-5.9.6.tar.xz https://download.qt.io/new_archive/qt/5.9/5.9.6/submodules/qtbase-opensource-src-5.9.6.tar.xz
        curl -L --retry 3 -o depends/sources/qttranslations-opensource-src-5.9.6.tar.xz https://download.qt.io/new_archive/qt/5.9/5.9.6/submodules/qttranslations-opensource-src-5.9.6.tar.xz
        curl -L --retry 3 -o depends/sources/qttools-opensource-src-5.9.6.tar.xz https://download.qt.io/new_archive/qt/5.9/5.9.6/submodules/qttools-opensource-src-5.9.6.tar.xz
    - name: Build depends (bdb, qt, qrencode)
      run: |
        make -C depends HOST=x86_64-w64-mingw32 -j$(nproc)
    - name: Build bls-dash for Windows (cross)
      run: |
        INSTALL_PREFIX=$GITHUB_WORKSPACE/depends/x86_64-w64-mingw32
        # Inline toolchain file - /usr/share/mingw-w64/toolchain-*.cmake yok
        cat > /tmp/mingw-toolchain.cmake <<'EOF'
        SET(CMAKE_SYSTEM_NAME Windows)
        SET(CMAKE_C_COMPILER x86_64-w64-mingw32-gcc-posix)
        SET(CMAKE_CXX_COMPILER x86_64-w64-mingw32-g++-posix)
        SET(CMAKE_RC_COMPILER x86_64-w64-mingw32-windres)
        SET(CMAKE_MAKE_PROGRAM make)
        SET(CMAKE_FIND_ROOT_PATH /usr/x86_64-w64-mingw32)
        SET(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
        SET(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
        SET(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
        EOF
        unset RELIC_MAIN
        git init /tmp/bls-win-src
        git -C /tmp/bls-win-src remote add origin https://github.com/dashpay/bls-signatures.git
        git -C /tmp/bls-win-src fetch --depth=1 origin 2daa8f8e220d9bd6aa0ac42a2eb550bb8c7341b5
        git -C /tmp/bls-win-src checkout --detach FETCH_HEAD
        for file in /tmp/bls-win-src/src/threshold.cpp /tmp/bls-win-src/src/threshold.hpp; do sed -i '1i#include <memory>' "$file"; done
        mkdir -p /tmp/bls-win-src/build && cd /tmp/bls-win-src/build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_C_FLAGS="-fPIC" -DCMAKE_CXX_FLAGS="-fPIC" -DCMAKE_TOOLCHAIN_FILE=/tmp/mingw-toolchain.cmake -DCMAKE_MAKE_PROGRAM=make -DCMAKE_INSTALL_PREFIX=$INSTALL_PREFIX -DBUILD_BLS_JS_BINDINGS=0 -DBUILD_BLS_PYTHON_BINDINGS=0 -DBUILD_BLS_TESTS=0 -DBUILD_BLS_BENCHMARKS=0 -DBUILD_SHARED_LIBS=OFF -DGMP_INCLUDE_DIR="$INSTALL_PREFIX/include" -DGMP_LIBRARY="$INSTALL_PREFIX/lib/libgmp.a"
        make -j$(nproc)
        LIB=$(find /tmp/bls-win-src/build -maxdepth 1 -name "libbls-dash.a" 2>/dev/null | head -1)
        if [ -z "$LIB" ]; then
          echo "ERROR: libbls-dash.a not found!"; find /tmp/bls-win-src/build -name "*.a"; exit 1
        fi
        mkdir -p $INSTALL_PREFIX/lib $INSTALL_PREFIX/include/bls-dash
        cp "$LIB" $INSTALL_PREFIX/lib/libbls-dash.a
        find /tmp/bls-win-src/src -maxdepth 1 -name "*.hpp" -exec cp {} $INSTALL_PREFIX/include/bls-dash/ \;
        find /tmp/bls-win-src/build/_deps/relic-src/include -name "*.h" -exec cp {} $INSTALL_PREFIX/include/ \; 2>/dev/null || true
        find /tmp/bls-win-src/build/_deps/relic-build/include -name "*.h" -exec cp {} $INSTALL_PREFIX/include/ \; 2>/dev/null || true
        echo "Library   : $(ls -lh $INSTALL_PREFIX/lib/libbls-dash.a)"
        echo "Headers   : $(ls $INSTALL_PREFIX/include/bls-dash/ | head -5)"
        echo "Relic     : $(ls $INSTALL_PREFIX/include/relic_conf.h 2>/dev/null || echo MISSING)"
    - name: Build Babacoin
      run: |
        ./autogen.sh
        CONFIG_SITE=$PWD/depends/x86_64-w64-mingw32/share/config.site ./configure --prefix=$PWD/depends/x86_64-w64-mingw32 --host=x86_64-w64-mingw32 --enable-tests --disable-bench --with-gui=qt5 --disable-stacktraces --disable-shared CPPFLAGS="-I$PWD/depends/x86_64-w64-mingw32/include" LDFLAGS="-L$PWD/depends/x86_64-w64-mingw32/lib"
        make -j$(nproc)

        make -C src -j2 test/test_babacoin.exe qt/test/test_babacoin-qt.exe
    - name: Package
      run: |
        mkdir -p desktop-output/src/test desktop-output/src/qt/test
        cp src/babacoind.exe src/babacoin-cli.exe src/babacoin-tx.exe desktop-output/src/
        cp src/qt/babacoin-qt.exe desktop-output/src/qt/
        cp src/test/test_babacoin.exe desktop-output/src/test/
        cp src/qt/test/test_babacoin-qt.exe desktop-output/src/qt/test/
        (cd desktop-output && find src -name '*.exe' -type f -exec sha256sum {} + > SHA256SUMS)
        printf '%s\n' "$GITHUB_SHA" > desktop-output/SOURCE_COMMIT
        cp config.log desktop-output/
        zip -j desktop-output/babacoin-windows-x86_64-test.zip src/babacoind.exe src/babacoin-cli.exe src/babacoin-tx.exe src/qt/babacoin-qt.exe
        (cd desktop-output && sha256sum *.zip > babacoin-windows-x86_64-test.zip.sha256)
    - uses: actions/upload-artifact@v4
      with:
        name: babacoin-windows-cross-build
        path: desktop-output
        if-no-files-found: error
    if: ${{ inputs.platform != 'macos' }}
  windows-native:
    name: Windows x64 native tests
    needs: windows-cross
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: babacoin-windows-cross-build
        path: desktop-build
    - name: Native core, Qt, utility, RPCAuth and wallet tests
      shell: pwsh
      run: |-
        python ci/windows-native-tests.py desktop-build desktop-output
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: babacoin-tested-windows-x64
        path: desktop-output
        if-no-files-found: error
