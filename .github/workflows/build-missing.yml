name: Native Windows and macOS compatibility (no release upload)
'on':
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to validate
        type: choice
        options:
        - all
        - macos
        - windows
        default: all
  workflow_call:
    inputs:
      platform:
        type: string
        default: all
permissions:
  contents: read
jobs:
  macos:
    name: macOS ${{ matrix.arch }} native tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-15
          arch: arm64
        - runner: macos-15-intel
          arch: x86_64
    steps:
    - uses: actions/checkout@v4
    - name: Build with BDB 4.8; run full native tests
      run: bash ci/macos-compat.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: babacoin-tested-macos-${{ matrix.arch }}
        path: desktop-output
        if-no-files-found: error
    if: ${{ inputs.platform != 'windows' }}
  windows-native:
    name: Windows x64 native tests
    needs: windows-build
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: babacoin-windows-native-build
        path: desktop-build
    - name: Native core, Qt, utility, RPCAuth and wallet tests
      shell: pwsh
      run: |-
        python ci/windows-native-tests.py desktop-build desktop-output
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Package only after native tests pass
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force package | Out-Null
        Copy-Item desktop-build/src/babacoind.exe,desktop-build/src/babacoin-cli.exe,desktop-build/src/babacoin-tx.exe,desktop-build/src/qt/babacoin-qt.exe package/
        Copy-Item desktop-build/src/*.dll package/
        Copy-Item -Recurse desktop-build/src/platforms,desktop-build/licenses package/
        Copy-Item desktop-build/SOURCE_COMMIT,desktop-build/packages.txt,desktop-build/COPYING package/
        Compress-Archive -Path package/* -DestinationPath desktop-output/babacoin-windows-x86_64-test.zip
        $hash = (Get-FileHash desktop-output/babacoin-windows-x86_64-test.zip -Algorithm SHA256).Hash.ToLowerInvariant()
        "$hash  babacoin-windows-x86_64-test.zip" | Set-Content -Encoding ascii desktop-output/babacoin-windows-x86_64-test.zip.sha256
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: babacoin-tested-windows-x64
        path: desktop-output
        if-no-files-found: error
  windows-build:
    name: Windows x64 UCRT native build
    if: ${{ inputs.platform != 'macos' }}
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@v4
    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: |-
          git
          make
          patch
          diffutils
          mingw-w64-ucrt-x86_64-toolchain
          mingw-w64-ucrt-x86_64-autotools
          mingw-w64-ucrt-x86_64-pkgconf
          mingw-w64-ucrt-x86_64-python
          mingw-w64-ucrt-x86_64-boost
          mingw-w64-ucrt-x86_64-openssl
          mingw-w64-ucrt-x86_64-libevent
          mingw-w64-ucrt-x86_64-miniupnpc
          mingw-w64-ucrt-x86_64-zeromq
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-gmp
          mingw-w64-ucrt-x86_64-qt5-base
          mingw-w64-ucrt-x86_64-qt5-tools
          mingw-w64-ucrt-x86_64-qt5-svg
          mingw-w64-ucrt-x86_64-protobuf
          mingw-w64-ucrt-x86_64-qrencode
    - name: Build with current dependencies and BDB 4.8
      shell: msys2 {0}
      run: |-
        bash ci/windows-compat.sh
        cp -a "$MINGW_PREFIX/share/licenses" desktop-output/licenses
        cp COPYING desktop-output/
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: babacoin-windows-native-build
        path: desktop-output
        if-no-files-found: error
