name: Validated V2 release candidate
'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: New release tag to create only after all checks pass
        required: true
        type: string
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
permissions:
  contents: read
  actions: read
jobs:
  ubuntu-compatibility:
    uses: ./.github/workflows/ubuntu-compatibility.yml
  debian-compatibility:
    uses: ./.github/workflows/debian-compatibility.yml
  upload-release:
    name: Assemble tested draft release
    needs:
    - ubuntu-compatibility
    - desktop-compatibility
    - debian-compatibility
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Preserve existing releases
      uses: actions/github-script@v7
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
      with:
        script: |
          const tag = process.env.RELEASE_TAG;
          if (!/^v2\.0\.0-rc\.[1-9][0-9]*$/.test(tag)) {
            core.setFailed('This pipeline currently creates V2.0.0 release candidates only.');
            return;
          }
          try {
            await github.rest.repos.getReleaseByTag({
              ...context.repo,
              tag
            });
            core.setFailed('A release already exists for this tag. Refusing to replace it.');
          } catch (error) {
            if (error.status !== 404) throw error;
          }
    - name: Verify the complete same-source release payload
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
        SOURCE_COMMIT: ${{ github.sha }}
      run: |
        python3 ci/assemble-release.py artifacts dist --tag "$RELEASE_TAG" --source-commit "$SOURCE_COMMIT"
        cp "doc/release/$RELEASE_TAG.md" dist/RELEASE-NOTES.md
        cp doc/v2-migration.md dist/MIGRATION.md
        cp doc/platform-support.md dist/PLATFORM-SUPPORT.md
        cp doc/release/mandatory-network-upgrade.md dist/NETWORK-UPGRADE.md
    - uses: actions/upload-artifact@v4
      with:
        name: babacoin-verified-release
        path: dist
    - uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.release_tag }}
        target_commitish: ${{ github.sha }}
        name: Babacoin ${{ inputs.release_tag }}
        draft: true
        prerelease: true
        generate_release_notes: false
        body_path: dist/RELEASE-NOTES.md
        fail_on_unmatched_files: true
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  desktop-compatibility:
    uses: ./.github/workflows/build-missing.yml
