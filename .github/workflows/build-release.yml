name: Validated V2 release
'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: New release tag to create only after all checks pass
        required: true
        type: string
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    name: Verify release identity before building
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Match the tag to the compiled version and release flag
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: python3 ci/release_policy.py --tag "$RELEASE_TAG"
    - name: Preserve existing releases and source tags
      uses: actions/github-script@v7
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
      with:
        script: |
          await require(process.env.GITHUB_WORKSPACE + '/ci/check-release-tag.js')({github, context, tag: process.env.RELEASE_TAG});
  ubuntu-compatibility:
    needs: preflight
    uses: ./.github/workflows/ubuntu-compatibility.yml
  debian-compatibility:
    needs: preflight
    uses: ./.github/workflows/debian-compatibility.yml
  upload-release:
    name: Assemble tested draft release
    needs:
    - ubuntu-compatibility
    - desktop-compatibility
    - debian-compatibility
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Preserve existing releases and source tags
      uses: actions/github-script@v7
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
      with:
        script: |
          await require(process.env.GITHUB_WORKSPACE + '/ci/check-release-tag.js')({github, context, tag: process.env.RELEASE_TAG});
    - name: Verify the complete same-source release payload
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
        SOURCE_COMMIT: ${{ github.sha }}
      run: |
        python3 ci/assemble-release.py artifacts dist --tag "$RELEASE_TAG" --source-commit "$SOURCE_COMMIT"
        cp "doc/release/$RELEASE_TAG.md" dist/RELEASE-NOTES.md
        cp doc/v2-migration.md dist/MIGRATION.md
        cp doc/platform-support.md dist/PLATFORM-SUPPORT.md
        cp doc/release/mandatory-network-upgrade.md dist/NETWORK-UPGRADE.md
    - uses: actions/upload-artifact@v4
      with:
        name: babacoin-verified-release
        path: dist
    - uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.release_tag }}
        target_commitish: ${{ github.sha }}
        name: Babacoin ${{ inputs.release_tag }}
        draft: true
        prerelease: false
        generate_release_notes: false
        body_path: dist/RELEASE-NOTES.md
        fail_on_unmatched_files: true
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  desktop-compatibility:
    needs: preflight
    uses: ./.github/workflows/build-missing.yml
