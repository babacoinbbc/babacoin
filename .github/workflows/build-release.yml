name: Validated multi-platform draft release
'on':
  push:
    tags:
    - v*
  workflow_dispatch: null
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
permissions:
  contents: read
jobs:
  ubuntu-compatibility:
    uses: ./.github/workflows/ubuntu-compatibility.yml
  upload-release:
    name: Assemble tested draft release
    needs:
    - ubuntu-compatibility
    - desktop-compatibility
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Preserve existing releases
      uses: actions/github-script@v7
      with:
        script: |
          try {
            await github.rest.repos.getReleaseByTag({
              ...context.repo,
              tag: context.ref.replace('refs/tags/', '')
            });
            core.setFailed('A release already exists for this tag. Refusing to replace it.');
          } catch (error) {
            if (error.status !== 404) throw error;
          }
    - uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Babacoin ${{ github.ref_name }}
        draft: true
        prerelease: ${{ contains(github.ref_name, '-test') || contains(github.ref_name, '-rc') }}
        generate_release_notes: true
        files: |
          artifacts/**/*.tar.gz
          artifacts/**/*.tar.gz.sha256
          artifacts/**/*.zip
          artifacts/**/*.zip.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  desktop-compatibility:
    uses: ./.github/workflows/build-missing.yml
